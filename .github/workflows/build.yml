name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project (any .zip file in repo root)
        run: |
          zipfile=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$zipfile" ]; then
            echo "Found zip: $zipfile"
            unzip -o "$zipfile" -d .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: SamboTrainer
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sambo-trainer-debug-apk
          path: SamboTrainer/app/build/outputs/apk/debug/app-debug.apk
